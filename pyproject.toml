[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diplomat"
version = "0.1.0"
description = "Scan your agentic codebase for unguarded tool calls with real-world side effects"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []  # zero mandatory runtime dependencies — stdlib only

[project.optional-dependencies]
rich = ["rich>=13.0"]
yaml = ["pyyaml>=6.0"]
all = ["rich>=13.0", "pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.4",
]

[project.scripts]
diplomat = "diplomat.cli:main"

[project.urls]
Homepage = "https://diplomat.run"
Repository = "https://github.com/diplomat-ai/diplomat"

[tool.hatch.build.targets.wheel]
packages = ["src/diplomat"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
