<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace">
  <defs>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#8b949e" font-size="13" font-family="'Segoe UI', system-ui, sans-serif" letter-spacing="0.5">Same agent. Same codebase. One scan apart.</text>

  <!-- LEFT PANEL — WITHOUT -->
  <rect x="20" y="55" width="415" height="370" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <!-- Traffic lights -->
  <circle cx="44" cy="77" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="77" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="77" r="6" fill="#27c93f"/>
  <!-- Label -->
  <text x="225" y="80" text-anchor="middle" fill="#6e7681" font-size="11" font-family="'Segoe UI', system-ui, sans-serif">WITHOUT diplomat-agent</text>
  <!-- Divider -->
  <line x1="20" y1="92" x2="435" y2="92" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal content LEFT -->
  <text x="38" y="116" fill="#7d8590" font-size="12">$</text>
  <text x="52" y="116" fill="#e6edf3" font-size="12">python agent.py</text>

  <text x="38" y="148" fill="#7d8590" font-size="11"># Agent starts...</text>
  <text x="38" y="166" fill="#7d8590" font-size="11"># Connecting to database</text>
  <text x="38" y="184" fill="#7d8590" font-size="11"># Calling external APIs</text>
  <text x="38" y="202" fill="#7d8590" font-size="11"># Sending notifications</text>
  <text x="38" y="220" fill="#7d8590" font-size="11"># Processing payments</text>
  <text x="38" y="238" fill="#7d8590" font-size="11"># ...</text>

  <text x="38" y="268" fill="#8b949e" font-size="11">34 functions touched the real world.</text>
  <text x="38" y="286" fill="#8b949e" font-size="11">Which ones had no checks?</text>

  <!-- Red warning box -->
  <rect x="30" y="306" width="390" height="88" rx="6" fill="#1c0a0a" stroke="#f85149" stroke-width="1"/>
  <text x="48" y="326" fill="#f85149" font-size="12" filter="url(#glow-red)">✗</text>
  <text x="64" y="326" fill="#f85149" font-size="12">You have no idea.</text>
  <text x="48" y="348" fill="#8b949e" font-size="11">26 functions had zero checks.</text>
  <text x="48" y="366" fill="#8b949e" font-size="11">You'll find out in production.</text>
  <text x="48" y="384" fill="#8b949e" font-size="11">Or worse — your users will.</text>

  <!-- RIGHT PANEL — WITH -->
  <rect x="465" y="55" width="415" height="370" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <!-- Traffic lights -->
  <circle cx="489" cy="77" r="6" fill="#ff5f56"/>
  <circle cx="507" cy="77" r="6" fill="#ffbd2e"/>
  <circle cx="525" cy="77" r="6" fill="#27c93f"/>
  <!-- Label -->
  <text x="672" y="80" text-anchor="middle" fill="#6e7681" font-size="11" font-family="'Segoe UI', system-ui, sans-serif">WITH diplomat-agent</text>
  <!-- Divider -->
  <line x1="465" y1="92" x2="880" y2="92" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal content RIGHT -->
  <text x="483" y="116" fill="#7d8590" font-size="12">$</text>
  <text x="497" y="116" fill="#e6edf3" font-size="12">diplomat-agent scan .</text>

  <text x="483" y="140" fill="#8b949e" font-size="10">Tool calls with side effects: 34</text>

  <!-- Warning 1 -->
  <text x="483" y="164" fill="#d29922" font-size="11">⚠ process_refund(order_id, amount)</text>
  <text x="495" y="180" fill="#7d8590" font-size="10">Payment:      NONE</text>
  <text x="495" y="194" fill="#7d8590" font-size="10">Input bounds: NONE</text>
  <text x="495" y="208" fill="#f85149" font-size="10">Governance: ❌ UNGUARDED</text>

  <!-- Warning 2 -->
  <text x="483" y="228" fill="#d29922" font-size="11">⚠ send_legal_notice(recipient, body)</text>
  <text x="495" y="244" fill="#7d8590" font-size="10">Email:        NONE · Rate limit: NONE</text>
  <text x="495" y="258" fill="#f85149" font-size="10">Governance: ❌ UNGUARDED</text>

  <!-- Confirmed -->
  <text x="483" y="278" fill="#3fb950" font-size="11">✓ charge_card(amount, currency)</text>
  <text x="495" y="292" fill="#7d8590" font-size="10"># checked:ok — protected by API gateway</text>
  <text x="495" y="306" fill="#3fb950" font-size="10">Governance: ✅ CONFIRMED</text>

  <!-- Divider -->
  <line x1="483" y1="316" x2="868" y2="316" stroke="#30363d" stroke-width="1"/>

  <!-- Summary -->
  <text x="483" y="333" fill="#8b949e" font-size="10">RESULT: 26 no checks · 7 partial · 1 confirmed</text>

  <!-- Green box -->
  <rect x="475" y="346" width="390" height="56" rx="6" fill="#0a1c0a" stroke="#3fb950" stroke-width="1"/>
  <text x="493" y="366" fill="#3fb950" font-size="12" filter="url(#glow-green)">✓</text>
  <text x="509" y="366" fill="#3fb950" font-size="12">You know exactly what's exposed.</text>
  <text x="493" y="386" fill="#8b949e" font-size="11">Fix it before it reaches production.</text>

  <!-- Bottom caption -->
  <text x="450" y="456" text-anchor="middle" fill="#484f58" font-size="11" font-family="'Segoe UI', system-ui, sans-serif">Zero runtime. Zero dependencies. Pure static analysis.</text>
</svg>
