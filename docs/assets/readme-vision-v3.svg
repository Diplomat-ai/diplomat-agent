<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1290" width="1280" height="1290" role="img" aria-label="Diplomat — your AI agents act on their own, your rules have to keep up: Assess, Control, Prove">
  <title>Diplomat — Assess · Control · Prove (README vision v3, dark)</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0f1b33" stroke-width="1"/>
    </pattern>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b36"/>
      <stop offset="1" stop-color="#060c1a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1628"/>
      <stop offset="1" stop-color="#08101f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .ln{animation:in .4s ease-out both}
      .edge{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease-out forwards}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    </style>
  </defs>

  <rect width="1280" height="1290" fill="#060b16"/>
  <rect width="1280" height="1290" fill="url(#grid)"/>

  <!-- ================= HERO ================= -->
  <rect x="40" y="40" width="1200" height="420" rx="16" fill="url(#hero)" stroke="#1e3a5f"/>
  <rect x="40" y="40" width="1200" height="420" rx="16" fill="url(#glow)"/>

  <text x="80" y="96" class="mono" font-size="13" letter-spacing="2" fill="#7dd3fc">DIPLOMAT  /  AI AGENT CONTROL</text>
  <text x="80" y="148" class="sans" font-size="36" font-weight="700" fill="#f1f5f9">Your AI agents</text>
  <text x="80" y="188" class="sans" font-size="36" font-weight="700" fill="#f1f5f9">act on their own.</text>
  <text x="80" y="228" class="sans" font-size="36" font-weight="700" fill="#7dd3fc">Your rules have</text>
  <text x="80" y="268" class="sans" font-size="36" font-weight="700" fill="#7dd3fc">to keep up.</text>
  <text x="80" y="306" class="sans" font-size="15" fill="#94a3b8">Diplomat turns your company's rules into automatic controls that</text>
  <text x="80" y="328" class="sans" font-size="15" fill="#94a3b8">block or approve every sensitive action your agents take, in under</text>
  <text x="80" y="350" class="sans" font-size="15" fill="#94a3b8">a millisecond, with verifiable proof.</text>

  <rect x="80" y="380" width="300" height="44" rx="22" fill="#0b1222" stroke="#334155"/>
  <text x="102" y="407" class="mono" font-size="15" fill="#e2e8f0"><tspan fill="#7dd3fc">$</tspan> pip install diplomat-agent</text>
  <text x="396" y="407" class="mono" font-size="13" fill="#64748b">→ step 1: Assess</text>

  <g transform="translate(0,28)">
  <!-- agent map panel -->
  <rect x="640" y="76" width="580" height="324" rx="12" fill="#020617" stroke="#1e293b"/>
  <text x="664" y="103" class="mono" font-size="12" fill="#94a3b8">AGENT MAP · what your agents can do</text>
  <rect x="1040" y="88" width="164" height="22" rx="11" fill="#0b1a30" stroke="#7dd3fc"/>
  <text x="1122" y="103" class="mono" font-size="11" fill="#7dd3fc" text-anchor="middle">NEXT RELEASE · PREVIEW</text>
  <line x1="640" y1="118" x2="1220" y2="118" stroke="#1e293b"/>

  <!-- edges agent -> tools -->
  <g fill="none" stroke-width="1.5" opacity="0.6">
    <path pathLength="1" class="edge" style="animation-delay:.2s" stroke="#ff5c5c" d="M768 242 C 802 242, 802 150, 836 150"/>
    <path pathLength="1" class="edge" style="animation-delay:.3s" stroke="#ff5c5c" d="M768 242 C 802 242, 802 196, 836 196"/>
    <path pathLength="1" class="edge" style="animation-delay:.4s" stroke="#f5b041" d="M768 242 L836 242"/>
    <path pathLength="1" class="edge" style="animation-delay:.5s" stroke="#3ddc84" d="M768 242 C 802 242, 802 288, 836 288"/>
    <path pathLength="1" class="edge" style="animation-delay:.6s" stroke="#64748b" d="M768 242 C 802 242, 802 334, 836 334"/>
  </g>

  <!-- agent node -->
  <rect x="664" y="217" width="104" height="50" rx="10" fill="#0b1a30" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="716" y="247" class="mono" font-size="13" fill="#f1f5f9" text-anchor="middle">my-agent</text>

  <!-- tool rows -->
  <g class="mono" font-size="12">
    <g class="ln" style="animation-delay:.8s">
      <rect x="836" y="134" width="190" height="32" rx="6" fill="#0a1323" stroke="#ff5c5c"/>
      <circle cx="852" cy="150" r="4" fill="#ff5c5c"/>
      <text x="866" y="154" fill="#e2e8f0">process_refund</text>
      <line x1="1026" y1="150" x2="1076" y2="150" stroke="#334155" stroke-dasharray="3 3"/>
      <rect x="1076" y="137" width="128" height="26" rx="6" fill="#3b0d0d"/>
      <text x="1140" y="154" font-size="11" fill="#ff5c5c" text-anchor="middle" font-weight="700">PAYMENT</text>
    </g>
    <g class="ln" style="animation-delay:.95s">
      <rect x="836" y="180" width="190" height="32" rx="6" fill="#0a1323" stroke="#ff5c5c"/>
      <circle cx="852" cy="196" r="4" fill="#ff5c5c"/>
      <text x="866" y="200" fill="#e2e8f0">delete_user_data</text>
      <line x1="1026" y1="196" x2="1076" y2="196" stroke="#334155" stroke-dasharray="3 3"/>
      <rect x="1076" y="183" width="128" height="26" rx="6" fill="#3b0d0d"/>
      <text x="1140" y="200" font-size="11" fill="#ff5c5c" text-anchor="middle" font-weight="700">DB DELETE</text>
    </g>
    <g class="ln" style="animation-delay:1.1s">
      <rect x="836" y="226" width="190" height="32" rx="6" fill="#0a1323" stroke="#f5b041"/>
      <circle cx="852" cy="242" r="4" fill="#f5b041"/>
      <text x="866" y="246" fill="#e2e8f0">send_digest</text>
      <line x1="1026" y1="242" x2="1076" y2="242" stroke="#334155" stroke-dasharray="3 3"/>
      <rect x="1076" y="229" width="128" height="26" rx="6" fill="#3a2a06"/>
      <text x="1140" y="246" font-size="11" fill="#f5b041" text-anchor="middle" font-weight="700">EMAIL</text>
    </g>
    <g class="ln" style="animation-delay:1.25s">
      <rect x="836" y="272" width="190" height="32" rx="6" fill="#0a1323" stroke="#3ddc84"/>
      <circle cx="852" cy="288" r="4" fill="#3ddc84"/>
      <text x="866" y="292" fill="#e2e8f0">update_order</text>
      <line x1="1026" y1="288" x2="1076" y2="288" stroke="#334155" stroke-dasharray="3 3"/>
      <rect x="1076" y="275" width="128" height="26" rx="6" fill="#0b3320"/>
      <text x="1140" y="292" font-size="11" fill="#3ddc84" text-anchor="middle" font-weight="700">DB WRITE</text>
    </g>
    <g class="ln" style="animation-delay:1.4s">
      <rect x="836" y="318" width="190" height="32" rx="6" fill="#0a1323" stroke="#475569"/>
      <circle cx="852" cy="334" r="4" fill="#64748b"/>
      <text x="866" y="338" fill="#e2e8f0">search_docs</text>
      <line x1="1026" y1="334" x2="1076" y2="334" stroke="#334155" stroke-dasharray="3 3"/>
      <rect x="1076" y="321" width="128" height="26" rx="6" fill="#111a2c"/>
      <text x="1140" y="338" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="700">READ-ONLY</text>
    </g>
  </g>

  <!-- legend -->
  <g class="mono" font-size="11" fill="#64748b">
    <circle cx="668" cy="378" r="4" fill="#ff5c5c"/><text x="678" y="382">unguarded</text>
    <circle cx="770" cy="378" r="4" fill="#f5b041"/><text x="780" y="382">partial</text>
    <circle cx="846" cy="378" r="4" fill="#3ddc84"/><text x="856" y="382">guarded</text>
    <circle cx="930" cy="378" r="4" fill="#64748b"/><text x="940" y="382">low risk</text>
    <text x="1204" y="382" text-anchor="end" fill="#475569">illustrative</text>
  </g>
  </g>

  <!-- ================= WHAT CHANGES ================= -->
  <rect x="40" y="488" width="1200" height="168" rx="16" fill="url(#card)" stroke="#1e3a5f"/>
  <text x="64" y="518" class="mono" font-size="11" letter-spacing="2" fill="#64748b">WHAT CHANGES</text>
  <text x="64" y="556" class="sans" font-size="24" font-weight="700" fill="#f1f5f9">An assistant suggests. <tspan fill="#7dd3fc">An agent executes.</tspan></text>
  <g class="sans">
    <text x="64" y="598" font-size="15" font-weight="600" fill="#e2e8f0">It acts without sign-off</text>
    <text x="64" y="620" font-size="13" fill="#94a3b8">An agent pays, writes, edits and deletes</text>
    <text x="64" y="638" font-size="13" fill="#94a3b8">without going back through a person.</text>
    <text x="464" y="598" font-size="15" font-weight="600" fill="#e2e8f0">An instruction is not a control</text>
    <text x="464" y="620" font-size="13" fill="#94a3b8">"Never wire more than €1,000" in a prompt is a</text>
    <text x="464" y="638" font-size="13" fill="#94a3b8">request. Only a rule applied to the action is a barrier.</text>
    <text x="864" y="598" font-size="15" font-weight="600" fill="#e2e8f0">Accountability stays yours</text>
    <text x="864" y="620" font-size="13" fill="#94a3b8">After an incident, leadership, customers and</text>
    <text x="864" y="638" font-size="13" fill="#94a3b8">auditors ask what happened, and who allowed it.</text>
  </g>

  <g transform="translate(0,236)">
  <!-- ================= HOW IT WORKS ================= -->
  <text x="40" y="464" class="mono" font-size="12" letter-spacing="2" fill="#64748b">HOW IT WORKS</text>

  <!-- rules (input) -->
  <rect x="40" y="480" width="200" height="300" rx="14" fill="#0a1323" stroke="#475569" stroke-dasharray="6 4"/>
  <text x="56" y="510" class="mono" font-size="11" letter-spacing="2" fill="#64748b">INPUT</text>
  <text x="56" y="538" class="sans" font-size="18" font-weight="700" fill="#f1f5f9">Your company</text>
  <text x="56" y="560" class="sans" font-size="18" font-weight="700" fill="#f1f5f9">rules</text>
  <g class="sans" font-size="13" fill="#cbd5e1">
    <rect x="56" y="580" width="168" height="28" rx="6" fill="#0f1b33" stroke="#1e3a5f"/><text x="70" y="599">Spend limits</text>
    <rect x="56" y="616" width="168" height="28" rx="6" fill="#0f1b33" stroke="#1e3a5f"/><text x="70" y="635">Approval thresholds</text>
    <rect x="56" y="652" width="168" height="28" rx="6" fill="#0f1b33" stroke="#1e3a5f"/><text x="70" y="671">Blocked recipients</text>
    <rect x="56" y="688" width="168" height="28" rx="6" fill="#0f1b33" stroke="#1e3a5f"/><text x="70" y="707">Contact frequency</text>
    <rect x="56" y="724" width="168" height="28" rx="6" fill="#0f1b33" stroke="#1e3a5f"/><text x="70" y="743">Business hours</text>
  </g>

  <!-- arrows between blocks -->
  <g fill="none" stroke="#334155" stroke-width="2">
    <path d="M246 630h18m-6 -6l6 6 -6 6"/>
    <path d="M580 630h16m-6 -6l6 6 -6 6"/>
    <path d="M911 630h16m-6 -6l6 6 -6 6"/>
  </g>

  <!-- CARD 1: ASSESS -->
  <rect x="270" y="480" width="306" height="300" rx="14" fill="url(#card)" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="294" y="524" class="mono" font-size="13" fill="#475569">01</text>
  <text x="326" y="524" class="mono" font-size="11" fill="#a3e635"><tspan class="pulse">●</tspan> you are here</text>
  <text x="294" y="566" class="sans" font-size="28" font-weight="700" fill="#7dd3fc">Assess</text>
  <text x="294" y="594" class="sans" font-size="14" fill="#94a3b8">What can our agents actually do?</text>
  <line x1="294" y1="612" x2="552" y2="612" stroke="#1e3a5f"/>
  <text x="294" y="640" class="mono" font-size="11" letter-spacing="2" fill="#64748b">OUTPUT</text>
  <text x="294" y="666" class="sans" font-size="15" font-weight="600" fill="#e2e8f0">Agent map + toolcalls.yaml</text>
  <text x="294" y="690" class="sans" font-size="13" fill="#64748b">Every side effect, with the guards it has</text>
  <rect x="294" y="722" width="258" height="40" rx="8" fill="#0b1a30" stroke="#1e3a5f"/>
  <text x="310" y="747" class="mono" font-size="13" fill="#e2e8f0">diplomat-agent</text>
  <text x="540" y="747" class="mono" font-size="11" fill="#64748b" text-anchor="end">Apache-2.0</text>
  <!-- icon -->
  <g fill="none" stroke-width="1.5">
    <path d="M510 530L546 514M510 530L546 530M510 530L546 546" stroke="#334155"/>
    <circle cx="510" cy="530" r="6" stroke="#7dd3fc"/>
    <circle cx="546" cy="514" r="4" fill="#ff5c5c" stroke="none"/>
    <circle cx="546" cy="530" r="4" fill="#f5b041" stroke="none"/>
    <circle cx="546" cy="546" r="4" fill="#3ddc84" stroke="none"/>
  </g>

  <!-- CARD 2: CONTROL -->
  <rect x="601" y="480" width="306" height="300" rx="14" fill="url(#card)" stroke="#1e3a5f"/>
  <text x="625" y="524" class="mono" font-size="13" fill="#475569">02</text>
  <text x="625" y="566" class="sans" font-size="28" font-weight="700" fill="#e2e8f0">Control</text>
  <text x="625" y="594" class="sans" font-size="14" fill="#94a3b8">Do our rules apply before agents act?</text>
  <line x1="625" y1="612" x2="883" y2="612" stroke="#1e3a5f"/>
  <text x="625" y="640" class="mono" font-size="11" letter-spacing="2" fill="#64748b">OUTPUT</text>
  <text x="625" y="666" class="sans" font-size="15" font-weight="600" fill="#e2e8f0">CONTINUE · REVIEW · STOP</text>
  <text x="625" y="690" class="sans" font-size="13" fill="#64748b">Before each call. No LLM, no network.</text>
  <rect x="625" y="722" width="258" height="40" rx="8" fill="#0a1323" stroke="#1e3a5f"/>
  <text x="641" y="747" class="mono" font-size="13" fill="#e2e8f0">diplomat-gate</text>
  <text x="871" y="747" class="mono" font-size="11" fill="#64748b" text-anchor="end">BSL 1.1</text>
  <g>
    <rect x="841" y="506" width="48" height="10" rx="5" fill="#3b0d0d" stroke="#ff5c5c"/>
    <rect x="841" y="524" width="48" height="10" rx="5" fill="#3a2a06" stroke="#f5b041"/>
    <rect x="841" y="542" width="48" height="10" rx="5" fill="#0b3320" stroke="#3ddc84"/>
  </g>

  <!-- CARD 3: PROVE -->
  <rect x="932" y="480" width="306" height="300" rx="14" fill="url(#card)" stroke="#1e3a5f"/>
  <text x="956" y="524" class="mono" font-size="13" fill="#475569">03</text>
  <text x="956" y="566" class="sans" font-size="28" font-weight="700" fill="#e2e8f0">Prove</text>
  <text x="956" y="594" class="sans" font-size="14" fill="#94a3b8">Can we show who authorized what?</text>
  <line x1="956" y1="612" x2="1214" y2="612" stroke="#1e3a5f"/>
  <text x="956" y="640" class="mono" font-size="11" letter-spacing="2" fill="#64748b">OUTPUT</text>
  <text x="956" y="666" class="sans" font-size="15" font-weight="600" fill="#e2e8f0">A receipt for every decision</text>
  <text x="956" y="690" class="sans" font-size="13" fill="#64748b">SHA-256 hash-chained · review queue</text>
  <rect x="956" y="722" width="258" height="40" rx="8" fill="#0a1323" stroke="#1e3a5f"/>
  <text x="972" y="747" class="mono" font-size="13" fill="#e2e8f0">gate audit</text>
  <text x="1202" y="747" class="mono" font-size="11" fill="#64748b" text-anchor="end">hosted: diplomat.run</text>
  <g fill="none" stroke-width="1.5">
    <path d="M1166 530h10M1190 530h10" stroke="#334155"/>
    <rect x="1152" y="523" width="14" height="14" rx="2" stroke="#7dd3fc"/>
    <rect x="1176" y="523" width="14" height="14" rx="2" stroke="#7dd3fc"/>
    <rect x="1200" y="523" width="14" height="14" rx="2" stroke="#a3e635" fill="#0b3320"/>
  </g>

  <text x="270" y="808" class="sans" font-size="14" fill="#94a3b8">Stop at any step. Each one delivers value on its own, you decide how far to go.</text>
  <text x="270" y="832" class="sans" font-size="14" fill="#94a3b8">Diplomat complements your security tools: they watch for threats, it enforces your decisions.</text>
  </g>
  <g transform="translate(0,284)">
  <!-- ================= PROOF + LIMITS ================= -->
  <rect x="40" y="836" width="590" height="134" rx="16" fill="url(#card)" stroke="#1e3a5f"/>
  <text x="64" y="866" class="mono" font-size="11" letter-spacing="2" fill="#64748b">REALITY CHECK  /  16 OPEN-SOURCE AGENT REPOS</text>
  <text x="62" y="930" class="sans" font-size="56" font-weight="800" fill="#ff5c5c">70.9%</text>
  <text x="250" y="906" class="sans" font-size="18" fill="#e2e8f0">of analyzable tool calls</text>
  <text x="250" y="930" class="sans" font-size="18" font-weight="700" fill="#f1f5f9">have no guard.</text>
  <text x="64" y="954" class="mono" font-size="11" fill="#475569">7,552 tool calls · inter-procedural tracing → REALITY_CHECK_RESULTS.md</text>

  <rect x="650" y="836" width="590" height="134" rx="16" fill="url(#card)" stroke="#1e3a5f"/>
  <text x="674" y="866" class="mono" font-size="11" letter-spacing="2" fill="#64748b">NARROW BY DESIGN</text>
  <g class="sans" font-size="13" fill="#94a3b8">
    <text x="674" y="896"><tspan fill="#7dd3fc">◆</tspan>  Static analysis of Python code. No runtime observation today.</text>
    <text x="674" y="922"><tspan fill="#7dd3fc">◆</tspan>  Gate enforces the rules you write. It does not read intent.</text>
    <text x="674" y="948"><tspan fill="#7dd3fc">◆</tspan>  The hash chain detects accidental corruption, not a privileged attacker.</text>
  </g>
  </g>
</svg>